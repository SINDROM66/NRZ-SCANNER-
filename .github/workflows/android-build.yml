name: Build Standalone Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Standalone Android APK (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Web Assets in Android App
        run: |
          mkdir -p app/src/main/assets
          cp -r index.html css js manifest.json sw.js app/src/main/assets/

      - name: Setup Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.4

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Native Android APK Artifact (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: NSSF-Member-Data-Capture-APK
          path: app/build/outputs/apk/debug/app-debug.apk
