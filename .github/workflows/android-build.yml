name: Build Standalone Android APKs (Online & Offline)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-apk:
    name: Compile Android APKs (Online & Offline)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & Install Platforms 34
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Prepare Web Assets in Android App
        run: |
          mkdir -p app/src/main/assets
          cp -r index.html css js manifest.json sw.js app/src/main/assets/

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build Both Online & Offline APKs with Gradle
        run: gradle assembleDebug --stacktrace

      - name: Upload Offline Android APK Artifact (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: NSSF-Offline-Member-Data-Capture-APK
          path: app/build/outputs/apk/offline/debug/*.apk

      - name: Upload Online Android APK Artifact (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: NSSF-Online-Member-Data-Capture-APK
          path: app/build/outputs/apk/online/debug/*.apk
