name: Build Native Android APK (Offline Scanner)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew || true

      - name: Build Debug APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            echo "Gradle wrapper not present in root directory. PWA Web App is deployed."
          fi

      - name: Upload Native Android APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NSSF-Member-Data-Capture-OfflineScanner-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
