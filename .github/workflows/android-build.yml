name: Build Pure Native Android APK (Google ML Kit Offline Scanner)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Pure Native Android APK (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
          add-job-summary: 'always'

      - name: Build Pure Native Debug APK with Gradle
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          gradle assembleDebug --no-daemon --info --stacktrace

      - name: Upload Native Android APK Artifact (.apk)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NSSF-Native-Offline-Scanner-APK
          path: app/build/outputs/apk/debug/*.apk
