name: Build Pure Native Android APK (Google ML Kit Offline Scanner)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Pure Native Android APK (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
          add-job-summary: 'always'

      - name: Create local.properties & Generate Wrapper
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      - name: Build Pure Native Debug APK with Gradlew
        run: ./gradlew assembleDebug --console=plain --stacktrace --full-stacktrace

      - name: Upload Native Android APK Artifact (.apk)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NSSF-Native-Offline-Scanner-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Build Failure Logs (If Failed)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Gradle-Build-Failure-Logs
          path: |
            app/build/reports/
            app/build/outputs/logs/
